:host{display:block;width:360px;height:800px;overflow:hidden;font-family:'Montserrat',-apple-system,sans-serif;color:#133253}
:host{white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
/* Mara 2.0 (Android), 360x800. Drawn in Figma at 0.75 (270x600; instances carry scaleFactor 0.75); every value here is the Figma value / 0.75. The frame's own 12px corners are left off. */
.f{position:relative;width:360px;height:800px;overflow:hidden;background:#FFFFFF;

.sx-c{flex:none;width:20px;height:20px;opacity:0}
