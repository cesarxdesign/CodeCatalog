<style>
:host{white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
:host {
  --navy: #123456;
  --white: #FFFFFF;
  --grey-cc: #CCCCCC;
  --pinkfold: #FF5081;
  --light-blue: #4ECFEF;
  --cool-grey: #FBFBFB;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
svg { display: block; }

.frame {
  position: relative;
  width: 375px;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  color: var(--navy);
}
.abs { position: absolute; }
/* runs that carry LNUM + TNUM in the file */
.num { font-feature-settings: "lnum" 1, "tnum" 1; }

/* Text boxes keep Figma's box; flex centres any overflow evenly. */
.tx   { position: absolute; display: flex; white-space: nowrap; }
.tx-c { justify-content: center; text-align: center; }
.tx-r { justify-content: flex-end; text-align: right; }
.tx-l { justify-content: flex-start; text-align: left; }
/* multi-line text boxes: a column, each line its own block */
.tb   { position: absolute; display: flex; flex-direction: column; white-space: nowrap; }
.tb-c { align-items: center; text-align: center; }
.tb-r { align-items: flex-end; text-align: right; }
.tb-l { align-items: flex-start; text-align: left; }

/* ---------- iOS Nav Bar (contracted) ---------- */
.ios        { left: 0; top: 0; width: 375px; height: 63px; }
.ios-bg     { left: 0; top: 0; width: 375px; height: 63px; }
/* Divider: 0.5px black under a 20% group opacity, spanning y 62.5-63 = half of row 62
   at 0.2, drawn as one crisp row at 0.1 */
.ios-div    { left: 0; top: 62px; width: 375px; height: 1px; background: rgba(0, 0, 0, 0.1); }
.ios-status { left: 0; top: 0; width: 375px; height: 44px; }
.ios-ctr    { left: 293.5px; top: 17.16px; width: 67px; height: 11.5px; }
.ios-fill   { left: 44.5px; top: 1.9167px; width: 18px; height: 7.6667px; background: #000; border-radius: 1.6px; }
/* Figma names SF Pro Text; the system face is listed first on purpose (library convention) */
.t-ios-time { font-family: -apple-system, 'SF Pro Text', sans-serif; font-feature-settings: normal;
              font-weight: 600; font-size: 15px; line-height: 18px; letter-spacing: -0.165px; color: #000; }
.t-ios-url  { font-family: -apple-system, 'SF Pro Text', sans-serif; font-feature-settings: normal;
              font-weight: 400; font-size: 12px; line-height: 15px; letter-spacing: -0.35px; color: #000; }
/* CSS adds letter-spacing after the last glyph; Figma's box does not */
.t-ios-time .trk { margin-right: 0.165px; }
.t-ios-url  .trk { margin-right: 0.35px; }

/* ---------- header/mobile ---------- */
.hdr       { left: 0; top: 63px; width: 375px; height: 72px; }
/* 0.333px #CCCCCC stroke, outside the box (the export inks row 135, not row 134):
   one crisp row at the alpha its coverage produces. Side bleed is clipped by the frame. */
.hdr-bg    { left: 0; top: 0; width: 375px; height: 72px; background: var(--white);
             box-shadow: 0 0 0 1px rgba(204, 204, 204, 0.333); }
.hdr-logo  { left: 24px; top: 16px; width: 140px; height: 44px; }
.hdr-btn   { left: 251px; top: 14px; width: 120px; height: 44px; }
.hdr-ico   { left: 66px; top: 0; width: 44px; height: 44px; }
/* icon/hamberder's vector, 24x22 at 10,11 of the 44 box. The instance overrides its fill to
   Dark #292929; the icon-level export still carries the main component's #123456. */
.hdr-vec   { left: 10px; top: 11px; width: 24px; height: 22px; }

.frame { height: 812px; background: #FBFBFB; }

.t-h1m    { font-weight: 700; font-size: 28px; line-height: 29px; letter-spacing: -1px; }   /* H1.m Bold 28 */
.t-h1m .trk { margin-right: 1px; }
.t-body14 { font-weight: 400; font-size: 14px; line-height: 18px; }                          /* Regular 14, 1.3 */
.t-lbl12  { font-weight: 500; font-size: 12px; line-height: 20px; }                          /* LabelS.m Medium 12 */
.t-disc12 { font-weight: 400; font-size: 12px; line-height: 15px; }                          /* Disclaimer Regular 12 */
.t-label20{ font-weight: 700; font-size: 20px; line-height: 24px; color: var(--white); }     /* Label Bold 20 */
.t-t4     { font-weight: 600; font-size: 12px; line-height: 15px; letter-spacing: 2px; text-transform: uppercase; } /* T4 SemiBold 12 */
.t-t4 .trk { margin-right: -2px; }
.t-link   { text-decoration: underline; text-decoration-skip-ink: none; text-underline-position: from-font; }
.pink     { color: var(--pinkfold); }

/* button/NotifyMe */
.btn      { left: 76px; top: 516px; width: 223px; height: 48px; }
.btn-bg   { inset: 0; background: var(--pinkfold); border-radius: 8px; }

/* inputBox/mobile - 2px #CCCCCC stroke inside the box (export inks x78-79) */

.inp-box  { left: 0; top: 20px; width: 219px; height: 40px; background: var(--white); border-radius: 6px;
            box-shadow: inset 0 0 0 2px var(--grey-cc); }

/* checkbox/Terms */
.chk      { left: 68px; top: 432px; width: 239px; height: 60px; }
.chk-box  { left: 0; top: 0; width: 44px; height: 44px; }

/* header/mobile here is the 92% fill with a 4-radius background blur */
.hdr-bg   { background: rgba(251, 251, 251, 0.92); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }

/* Measured correction, not a Figma value: Chrome and Figma place the baseline differently here;
   these styles rendered ~1px high against the Figma export, so they move down 1px. */
.t-h1m { translate: 0 1px; }
