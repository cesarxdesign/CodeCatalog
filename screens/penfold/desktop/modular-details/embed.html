  <div class="t b3" style="left:342px;top:2140px;width:520px;white-space:pre-wrap"><p>Penfold and Gaudi intend to move the Penfold Pension to a new registered pension scheme in due course, with no additional cost or charge to you.</p><p>&#8203;</p><p>By accepting these terms you acknowledge the above and note that:</p><p>&#8203;</p><p class="b3i">On and from the date we give you notice that the transfer of your interests in the Penfold Pension under the Scheme to an arrangement for you under another registered pension scheme selected by us will happen, you hereby authorise and instruct Penfold and Gaudi to transfer your contributions to and Investments in the Penfold Pension held at that date, and apply any cash or investment received in your Penfold Pension after that date to the arrangement under the registered pension scheme selected by us for your benefit, along<br>with all your information and transaction history held under your Penfold Pension to that new registered pension scheme all as more particularly described in the notice that will be given by us to you telling you of that move.</p></div>
