  <p class="t nw h1" style="left:280px;top:129px">Set up your Direct Debit</p>
  <p class="t nw p" style="left:280px;top:215px">Please confirm your regular payment details below. Remember, you always<br>have absolute flexibility with Penfold, so you can pause or change payments at<br>any time via your account page.</p>

  <p class="t nw p" style="left:476px;top:318px">per month</p>
  <p class="t nw sub" style="left:476px;top:340px">(you can change this later)</p>

  <div class="box" style="left:280px;top:380px;width:180px;height:52px"></div>

  <p class="t nw p" style="left:280px;top:446px">If you choose a date within the next 8 days your first payment may not be taken<br>until the following month.</p>

  <p class="t nw h3" style="left:280px;top:511px">Bank details</p>

  <div class="dd-dot" style="top:957px"></div><p class="t nw dd-li" style="top:951px">The Guarantee is offered by all banks and building societies that accept instructions to<br>pay Direct Debits</p>
  <div class="dd-dot" style="top:1009px"></div><p class="t nw dd-li" style="top:1003px">If there are any changes to the amount, date or frequency of your Direct Debit Penfold<br>will notify you (normally 10 working days) in advance of your account being debited or<br>as otherwise agreed. If you request Penfold to collect a payment, confirmation of the<br>amount and date will be given to you at the time of the request</p>
  <div class="dd-dot" style="top:1097px"></div><p class="t nw dd-li" style="top:1091px">If an error is made in the payment of your Direct Debit, by Penfold or your bank or<br>building society, you are entitled to a full and immediate refund of the amount paid<br>from your bank or building society</p>
  <div class="dd-dot" style="top:1169px"></div><p class="t nw dd-li" style="top:1163px">If you receive a refund you are not entitled to, you must pay it back when Penfold asks<br>you to</p>
  <div class="dd-dot" style="top:1221px"></div><p class="t nw dd-li" style="top:1215px">You can cancel a Direct Debit at any time by simply contacting your bank or building<br>society. Written confirmation may be required. Please also notify the organisation.</p>

  <p class="t nw p" style="left:320px;top:1346px">I have read and accept this Direct Debit Mandate.</p>

  <p class="t nw p note" style="left:280px;top:1391px">Please note our business partner <span class="b">Seccl Custody Limited</span> (Service user<br>number 184278) is the one who actually holds all customer money in a<br>safeguarded separate bank account &mdash; so their name will appear on your bank<br>statement.</p>
  <p class="t nw p" style="left:280px;top:1510px">Please also read <span class="pink" style="text-decoration:underline">this notice</span> in relation to your clawback rights.</p>
