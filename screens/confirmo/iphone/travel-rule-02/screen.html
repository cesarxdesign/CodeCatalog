<div class="cc-screen" data-cc="confirmo/iphone/travel-rule-02" style="--cc-w:402;--cc-h:874;width:calc(var(--cc-w)*var(--cc-scale,1)*1px);height:calc(var(--cc-h)*var(--cc-scale,1)*1px);overflow:hidden;background:var(--cc-bg,transparent)">
<div style="width:402px;height:874px;transform:scale(var(--cc-scale,1));transform-origin:0 0"><template shadowrootmode="open"><style>
:host{display:block;width:402px;height:874px;overflow:hidden;font-family:'Montserrat',-apple-system,sans-serif;color:#133253}
:host{white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
svg { display: block; }

/* FRAME 560x978, square: Figma's 26px artboard corners (and its drop shadow on 01 and 06) are left off.
   Not a scaled artboard: type sizes are whole numbers at this size (30, 20, 18, 16, 15, 14, 12).
   The only fractions come from component instances Figma scaled (Line Item x1.11458, icons). */
.frame { position: relative; width: 560px; height: 978px; overflow: hidden; background: #fff;
         font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; color: #000; -webkit-font-smoothing: antialiased; }
.a  { position: absolute; }
.nw { white-space: nowrap; }
.sy { position: absolute; pointer-events: none; overflow: visible; }  /* SF Symbol glyph, outlined by Figma's export */
.gs { position: absolute; left: 0; top: 0; pointer-events: none; }    /* 'linear stroke' */
.ph { display: block; flex: none; }                                    /* the box a symbol's text node holds in a row */

/* type: line heights are Figma's text-box heights (IBM Plex auto = 1.3, box rounded) */
.s12 { font-size: 12px; line-height: 16px; }
.s14 { font-size: 14px; line-height: 18px; }
.s15 { font-size: 15px; line-height: 20px; }
.s16 { font-size: 16px; line-height: 21px; }
.s18 { font-size: 18px; line-height: 23px; }
.s20 { font-size: 20px; line-height: 26px; }
.w3 { font-weight: 300; } .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
.mono { font-family: 'IBM Plex Mono', monospace; }
/* Baseline rounding. IBM Plex: ascent 1.025em, descent .275em. Figma rounds the baseline, round(a + (lh - a - d)/2);
   Chrome rounds ascent and descent first and floors. They agree at 14/18, 18/23 and 30/39 and differ by one
   pixel at 12/16, 15/20, 16/21, 20/26 and the two scaled list sizes, so those are set one pixel down. An engine difference, not a design value. */
.s12, .s15, .s16, .s20, .lin, .lis { translate: 0 1px; }

/* shell */
.yb { left: 0; bottom: 0; width: 560px; height: 189px; background: linear-gradient(90deg, #FFD600 23.5577%, #F7EAA5 100%); }
.pb { left: 0; top: 0; width: 560px; height: 189px; background: linear-gradient(90deg, #CD99FF 24.5192%, #EBD9FC 100%); }
.ck { left: 0; bottom: -2px; width: 560px; display: flex; align-items: center; justify-content: center; padding: 15px 21px; }
.ckt { flex: 1 0 0; min-width: 1px; text-align: center; color: #424242; letter-spacing: .28px; }
.tb { left: 0; top: 2px; width: 560px; height: 40px; }
.tbl { left: 32px; top: 10px; display: flex; gap: 8px; align-items: center; }
.tbt { color: #424242; letter-spacing: -.28px; white-space: nowrap; }
.en { left: 479px; top: 10px; }                 /* Frame 53 x454 + pad 4 + globe 17 + gap 4 */
.pl { left: 216px; top: 15px; display: flex; gap: 8px; align-items: center; }
.p  { position: relative; width: 24px; height: 8px; border-radius: 24px; flex: none; }
.card { left: 0; top: 41px; width: 560px; height: 894px; border-radius: 32px; background: #fff; overflow: hidden; }

/* title block */
.hd { left: 0; width: 560px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 28px 34px; color: #4C3F91; }
.h1 { font-weight: 600; font-size: 30px; line-height: 39px; letter-spacing: -.3px; white-space: nowrap; }
.h1c { font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif; }   
.hp { letter-spacing: .15px; }

/* tabs */
.tabs { left: 32px; top: 147px; width: 293px; height: 32.75px; }
.tabr { left: 2px; top: 0; display: flex; gap: 28px; align-items: center; letter-spacing: -.18px; white-space: nowrap; }
.tab1 { font-weight: 700; color: #000; }
.tab0 { font-weight: 500; color: #424242; }
.ul { height: 2px; background: #8100FE; }

/* sort */
.sort { right: 32px; top: 146px; width: 120px; display: flex; gap: 8px; align-items: flex-start; justify-content: center;
        padding: 5px 12px 8px 8px; border-radius: 8px; background: #F0F2FF; }
.sortt { flex: 1 0 0; min-width: 1px; text-align: center; color: #4C3F91; letter-spacing: .16px; }

/* token / network list. 'Line Item / token' is an instance scaled 535/480 */
.list { left: 0; top: 204px; width: 560px; overflow: hidden; }
.lcol { left: 0; top: 0; width: 560px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 0 48px; }
.li { display: flex; gap: 17.8333px; align-items: center; padding: 6.6875px 8.9167px; border-radius: 40px; width: 535px; flex: none; }
.lit { display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; flex: none; }
.lin { font-weight: 600; font-size: 20.0625px; line-height: 26px; letter-spacing: -.40125px; color: #000; margin-bottom: -3.34375px; }
.lis { font-weight: 500; font-size: 13.375px; line-height: 17px; color: #B4B4B4; }
.ic { position: relative; flex: none; }
.icc { position: absolute; inset: 0; overflow: hidden; }

/* payment summary */
.sum { left: 0; bottom: 155px; width: 560px; background: #fff; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 0 32px; }
.sl { position: relative; width: 100%; height: 0; flex: none; }
.sl::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: #EEEEEE; }
.sh { position: relative; width: 100%; flex: none; display: flex; padding: 14px; border-radius: 10.5px; background: #F0F2FF; }
.sh-c { align-items: center; justify-content: space-between; }
.sh-b { align-items: flex-start; gap: 6px; }                /* Figma: baseline; children sit at y 17 / 14 / 15 */
.pd { color: #000; white-space: nowrap; flex: none; }
.sh-b .pd { margin-top: 3px; }
.tn { display: flex; gap: 8px; align-items: center; flex: none; }
.sh-b .tn { flex: 1 0 0; min-width: 1px; justify-content: flex-end; align-items: flex-start; }
.il { display: flex; gap: 7px; align-items: center; flex: none; }
.sh-b .il { align-items: flex-start; }
.ti { position: relative; width: 21px; height: 21px; flex: none; }
.sh-b .ti { height: 16px; margin-top: 1px; }
.ilt { color: #000; letter-spacing: -.16px; white-space: nowrap; }
.on { color: #7F7F7F; white-space: nowrap; }
.sls { width: 100%; flex: none; display: flex; flex-direction: column; align-items: flex-start; padding: 0 14px; }
.sr { display: flex; gap: 24px; align-items: center; width: 100%; flex: none; }
.srl { color: #888888; white-space: nowrap; flex: none; }
.srl.b { font-weight: 700; color: #000; }
.srf { position: relative; flex: 1 0 0; min-width: 1px; align-self: stretch; }
/* Line 14: 1px #BBBBBB at 20%, sitting above y = 21 - 5.25 */
.srf.ln::before { content: ""; position: absolute; left: 0; right: 0; top: 14.75px; height: 1px; background: rgba(187,187,187,.2); }
/* values pair: the instance holds its two values 18 apart (get_metadata 1:3166: 137 - 44 - 75), not the main component's 31.5 */
.vp { display: flex; gap: 18px; align-items: center; flex: none; white-space: nowrap; }
/* Figma hugs each mono value to a whole-pixel box (get_metadata: 84 = 48 + 7 + 29); widths are set inline */
.v  { display: flex; gap: 7px; align-items: center; justify-content: flex-end; flex: none; }
.rate { display: flex; gap: 8px; align-items: center; justify-content: center; width: 100%; flex: none; color: #8100FE; }
.rate p { flex: 1 0 0; min-width: 1px; }

/* button / pay from wallet */
.cta { left: 24px; width: 512px; height: 114px; border-radius: 24px; overflow: hidden; }
