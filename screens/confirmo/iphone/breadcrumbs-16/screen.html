.pm{font-family:'IBM Plex Mono',monospace}
/* line heights are Figma's text-box heights: the file rounds each line box to whole px at the
   scaled size, so 14px type sits on 9/0.46798 = 19.232px, not on 1.3em */
.t10{font-size:10px;line-height:12.821px}
.t12{font-size:12px;line-height:14.958px}
.t14{font-size:14px;line-height:19.232px}
.t16{font-size:16px;line-height:21.368px}
.t18{font-size:18px;line-height:23.505px}
.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.lm1{letter-spacing:-.01em}.l08{letter-spacing:.008em}.lm02{letter-spacing:-.002em}.l12{letter-spacing:.012em}
.l2{letter-spacing:.02em}.lm08{letter-spacing:-.008em}
.tr{text-align:right}.tc{text-align:center}
.ctr{display:flex;align-items:center;justify-content:center}
.pur{color:#8100FF}.red{color:#D90000}.wht{color:#fff}

/* ---- extra shade ---- */
.shade{left:0;top:406px;width:375px;height:406px;opacity:.24;mix-blend-mode:multiply}

/* Every SF Pro / SF Compact text node (status bar time, browser bar, keyboard, all SF Symbols) is Figma's own
   outlined SVG export of that node, drawn as an overlay over the frame box: .ol */
.ol{pointer-events:none}
/* ---- iOS / top menu ---- */
.sb{left:0;top:0;width:375px;height:62px}
.sb-in{left:-33px;top:0;width:441px;display:flex;gap:154px;align-items:center;justify-content:center;padding:21px 16px 19px}
.sb-time{flex:1 0 0;height:22px;padding-top:2px;display:flex;align-items:center;justify-content:center}
.sb-lv{flex:1 0 0;height:22px;padding-top:1px;display:flex;gap:7px;align-items:center;justify-content:center}
.sb-lv img{flex:none}

/* ---- navigation ALT ---- */
.nav{left:0;top:62px;width:375px;height:48px;background:#F4F4F4}
.nav-ext{left:.04px;top:-66.49px;width:375px;height:114px}
.nav-val{left:32px;top:12.33px;width:24px;height:24px;font-weight:700;font-size:13px;letter-spacing:.39px}
.nav-val span{margin-right:-.39px}   /* CSS adds tracking after the last glyph; Figma's box does not */
.nav-st{left:71.93px;top:23.22px;font-weight:500;letter-spacing:.2px}
/* navigation / expansion (the open menu sheet) */
.nx{left:0;top:48px;width:375px;height:344px;background:#fff;border-radius:0 0 32px 32px;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.12)}
.nx-row{left:0;width:373.95px;height:40px;border-radius:8px}
.nx-btn{background:#F4F4F4;border-radius:4px}
.nx-cookie{left:24px;top:265.57px;width:327px;white-space:normal;text-align:center}
.grab{width:55.56px;height:4.27px;background:#000;border-radius:8px}

/* ---- View Header ---- */
.vh{left:0;top:110px;width:375px;height:64px;background:#F4F4F4;display:flex;align-items:center;padding:0 24px}
.vh.line{box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.vh-p{flex:1 0 0;min-width:1px}
.vh.c{justify-content:center;gap:8px}
.vh-ico{width:24px;height:23.505px;flex:none}

/* ---- payment tab switcher ---- */
.tabs{left:0;top:110px;width:375px;height:72px;background:#F4F4F4;display:flex;gap:16px;align-items:center;justify-content:center;padding:0 24px}
.tabs div{flex:none}

/* ---- Crypto Line Item ---- */
.list{left:0;width:375px;display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px 24px}
.li{position:relative;flex:none;width:327px;height:72px;background:#fff;border-radius:12px;display:flex;gap:4px;align-items:center;padding:16px}
.li-ic{position:relative;flex:none;width:32px;height:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.li-tx{flex:none;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:0 4px;overflow:hidden}
.li-foot{opacity:.4}
.li-val{flex:1 0 0;min-width:1px;display:flex;gap:4px;align-items:center;justify-content:flex-end}
.li-val.e{height:18px}
.li-cur{width:34px;flex:none}
/* hug-width boxes anchored from the right keep the file's box width (Figma rounds it up at the scaled size) */
.li-am{width:83.34px;flex:none}
.li-chev{flex:none;width:8.55px;height:12.821px}

/* ---- payment breadcrum ---- */
.bc{left:0;width:375px;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
/* shade/blur: BACKGROUND_BLUR radius 24 -> blur(12px) */
.bc-sh{left:-53.96px;top:0;width:483px;height:306px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
/* Figma shows a background blur only through the layer's own fill alpha: the blur fades in with the gradient */
.bc-bl{left:-53.96px;top:0;width:483px;height:306px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000);mask-image:linear-gradient(180deg,transparent,#000)}
.bc-st{position:relative;flex:none;width:56px;height:56px}
.bc-el{left:-4px;top:-3px;width:64px;height:64px}
.bc-n{left:0;top:0;width:55.56px;height:55.56px;font-size:20px}
.bc-ln{position:relative;flex:1 0 0;min-width:1px;padding:0 3px;border-radius:8px}
.bc-ln i{display:block;height:2px;background:#8100FF;border-radius:32px}

/* ---- summary ---- */
.sm{left:0;width:375px;background:#fff;border-radius:12px 12px 0 0;overflow:hidden}
.sm-l{left:0;width:373.95px;display:flex;flex-direction:column}
.sm-r{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px}
.sm-g{flex:none;display:flex;gap:8px;align-items:center}
.sm-ic{position:relative;flex:none;width:24px;height:24px}
.sm-cc{width:40px;flex:none}
.btn{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 21px;border-radius:32px}
.btn-ico{width:24px;height:19.232px;flex:none}

/* ---- iOS browser bottom ---- */
.bb{left:0;top:729px;width:375px;height:83px}
.bb-bl{opacity:.67}
/* Blur: #000 at 4%, hard light, LAYER_BLUR 20 -> blur(10px), BACKGROUND_BLUR 40 -> blur(20px), under a luminance mask */
.bb-bl i{position:absolute;display:block;border-radius:1000px;background:rgba(0,0,0,.04);mix-blend-mode:hard-light;filter:blur(10px);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mask-mode:luminance}
.bb-f{border-radius:296px}
.bb-f1{background:#333;mix-blend-mode:color-dodge}
.bb-f2{background:rgba(255,255,255,.5)}
/* #F7F7F7 linear burn = backdrop - 8: CSS has no linear burn, difference with #080808 gives the same over a light backdrop */
.bb-f3{background:#080808;mix-blend-mode:difference}
/* Glass effect, radius 6: CSS has no glass; its frost is kept as a backdrop blur */
.bb-gl{border-radius:296px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

/* ---- warning token network ---- */
.wn{left:24px;top:181.63px;width:327px;background:#fff;box-shadow:inset 0 0 0 1px rgba(129,0,255,.24);overflow:hidden;
  display:flex;gap:16px;align-items:flex-start;padding:12px 16px}
.wn-ic{flex:none;width:32.053px;height:34.189px}
/* 6px in the file = 12.82px; line height 16 lands on 7.5/0.46798 */
.wn-c{flex:1 0 0;min-width:1px;white-space:pre-wrap;font-size:12.821px;line-height:16.026px;letter-spacing:.02em}
.wn-c b{font-weight:700}.wn-c u{text-decoration:underline;text-underline-position:from-font;font-weight:700}

/* ---- QR ---- */
.qr{width:220px;display:flex;flex-direction:column;gap:16px;align-items:center}
.qr-b{position:relative;flex:none;width:220px;height:220px;background:#fff;border-radius:16px}
.qr-i{left:12.375px;top:11.915px;width:195.25px;height:196.17px;overflow:hidden}
.qr-l{width:220px;text-align:center}

/* ---- wallets ---- */
.wr{left:0;width:375px;height:78.96px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.wt{flex:none;display:flex;flex-direction:column;align-items:center}
.wi{position:relative;flex:none;width:64px;height:64px;background:#fff;border-radius:16px;overflow:hidden}
.wi img{left:2px;top:2px;width:60px;height:60px;border-radius:16px}
.wi::after{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 4px #fff}
.srch{left:24px;top:255px;width:327px;height:40px;background:#fff;border-radius:8px;display:flex;gap:8px;align-items:center;padding:8px}
.srch-i{flex:none;height:19.232px}

/* ---- pay from wallet ---- */
.pw{left:48px;top:360px;width:279px;height:72px;background:#000;border-radius:40px;box-shadow:0 4px 12px rgba(0,0,0,.32);
  display:flex;gap:8px;align-items:center;padding:8px 24px 8px 8px}
.pw-c{position:relative;flex:none;width:56px;height:56px;border-radius:40px;overflow:hidden}
.pw-c img{left:-2.22px;top:-2.22px;width:60px;height:60px;border-radius:16px}
.msg{left:0;width:375px;border-radius:8px;display:flex;gap:8px;align-items:flex-start}
.msg-b{flex:1 0 0;min-width:1px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* ---- manual ---- */
.mn{left:0;top:272px;width:375px;display:flex;flex-direction:column;gap:8px;padding:0 40px}
.mn-r{position:relative;flex:none;background:#fff;border-radius:8px;padding:8px 10px}
.mn-r.h{display:flex;align-items:center;justify-content:space-between}
.mn-r.v{display:flex;flex-direction:column;gap:6px}

/* ---- receipt ---- */
.il{left:0;top:192px;width:375px;display:flex;flex-direction:column;gap:4px;padding:0 40px}
.sl{flex:none;display:flex;align-items:flex-end;justify-content:space-between}
.fil{flex:none;height:17px;padding:8px 0;opacity:.08}
.fil i{display:block;height:1px;background:#000}

/* ---- keyboard ---- */
.kb-bg{left:0;top:490px;width:373.95px;height:322.66px;border-radius:27px;overflow:hidden;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.kb-bg i{position:absolute;inset:0;display:block}
.kk{border-radius:8.5px;background:#141414;mix-blend-mode:plus-lighter}   /* #141414 linear dodge = backdrop + 20 */

/* ---- iPhone frame for the normalised copy: 402x874, the same chrome on every Confirmo screen ---- */
.iph{position:relative;width:402px;height:874px;overflow:hidden;font-family:'Inter',-apple-system,system-ui,sans-serif;color:#000}
.iph-lay{position:absolute;left:0;width:402px;overflow:hidden}
.iph-sc{position:absolute;left:0;top:0;transform-origin:0 0}
.iph-sb{position:absolute;left:0;top:0;width:402px;height:62px;background:var(--sb-bg,transparent);color:var(--ink,#000);z-index:20}
.iph-sb p{position:absolute;left:0;top:22px;width:152px;margin:0;padding:0;text-align:center;font-family:inherit;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;font-feature-settings:"tnum" 1}
.iph-sb svg{position:absolute;left:0;top:0;display:block}
.iph-hi{position:absolute;left:0;bottom:0;width:402px;height:34px;background:var(--hi-bg,transparent);z-index:20}
.iph-hi::after{content:"";position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:2.5px;background:var(--ink,#000)}
