<style>
:host{display:block;white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
:host {
  --violet-100: #8100FF;   /* Violet 100 */
  --yellow-100: #FFD600;   /* Yellow 100 */
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
svg { display: block; }

.frame {
  position: relative;
  overflow: hidden;                 /* the frame clips its content; Figma's 32px corner radius is frame chrome, left off */
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 400;
  color: #000;
  -webkit-font-smoothing: antialiased;
}
.abs { position: absolute; }
.tx  { position: absolute; white-space: nowrap; }
.tc  { text-align: center; }
.cx  { transform: translateX(-50%); }   /* Figma centres these on an x, not in a box */

.b6  { font-weight: 600; }

/* type - auto line height in the file; px = Figma's text-box height / line count */
.t-amt   { font-weight: 600; font-size: 30px; line-height: 39px; }
.t-title { font-weight: 500; font-size: 26px; line-height: 34px; letter-spacing: -0.624px; }

.t-12    { font-weight: 400; font-size: 12px; line-height: 16px; }
.frame { width: 560px; height: 700px; }
