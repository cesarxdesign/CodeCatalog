<div class="cc-screen" data-cc="confirmo/mobile/last-shipped-07" style="--cc-w:402;--cc-h:874;width:calc(var(--cc-w)*var(--cc-scale,1)*1px);height:calc(var(--cc-h)*var(--cc-scale,1)*1px);overflow:hidden;background:var(--cc-bg,transparent)">
<div style="width:402px;height:874px;transform:scale(var(--cc-scale,1));transform-origin:0 0"><template shadowrootmode="open"><style>
:host{display:block;width:402px;height:874px;overflow:hidden;font-family:'Montserrat',-apple-system,sans-serif;color:#133253}
:host{white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
:host {
  --f00: #000000; --f42: #424242; --f69: #696969; --f99: #999999; --fb4: #B4B4B4; --feb: #EBEBEB; --ff8: #F8F8F8; --fff: #FFFFFF;
  --main: #7040F0; --main-dark: #2F0B8E; --main-lite: #B8A0F8; --main-xlite: #F4F1FE; --secondary: #F8C808;
  --negative: #D12525; --positive: #26A17B; --f0f2ff: #F0F2FF;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
svg { display: block; flex: none; }

/* the artboard's 56px corner radius and the phone bezel are left out on purpose: a plain rectangle */
.frame { position: relative; width: 402px; height: 874px; background: var(--fff);
  font-family: 'Inter', sans-serif; font-optical-sizing: none; font-style: normal; font-weight: 400; color: var(--f00);
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.abs { position: absolute; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 0 0; min-width: 1px; }
.nw { white-space: nowrap; }
.num { font-feature-settings: "lnum" 1, "tnum" 1; }

/* type: one class per named style; line heights are Figma's text-box height / line count */
.t11 { font-size: 11px; line-height: 13px; }
.t12 { font-size: 12px; line-height: 15px; letter-spacing: 0.24px; }                       /* 12/Regular, 2% */
.t12m { font-size: 12px; line-height: 15px; letter-spacing: 0.12px; font-weight: 500; }    /* 12/Medium, 1% */
.t12n { font-size: 12px; line-height: 15px; letter-spacing: 0.12px; }                      /* 12mono/Regular, 1% */
.t13 { font-size: 13px; line-height: 16px; letter-spacing: 0.26px; }                       /* 13/Regular, 2% */
.t13l { font-size: 13px; line-height: 16px; letter-spacing: 0.13px; font-weight: 300; }    /* 13mono/Light, 1% */
.t13bn { font-size: 13px; line-height: 16px; letter-spacing: 0.13px; font-weight: 700; }   /* total: Bold on the 13mono tracking */
.t14 { font-size: 14px; line-height: 17px; }
.t14m { font-size: 14px; line-height: 17px; font-weight: 500; }
.t14n { font-size: 14px; line-height: 17px; letter-spacing: -0.14px; }                     /* 14mono/Regular, -1% */
.t14sb { font-size: 14px; line-height: 17px; letter-spacing: -0.14px; font-weight: 600; }  /* 14/SemiBold, -1% */
.t16 { font-size: 16px; line-height: 19px; }
.t16m { font-size: 16px; line-height: 19px; letter-spacing: 0.16px; font-weight: 500; }    /* 16/Medium, 1% */
.t16sb { font-size: 16px; line-height: 19px; letter-spacing: -0.16px; font-weight: 600; }  /* 16/SemiBold, -1% */
.t16b { font-size: 16px; line-height: 19px; letter-spacing: -0.16px; font-weight: 700; }   /* 16/Bold, -1% */
.t16i { font-size: 16px; line-height: 19px; font-style: italic; }
.t18sb { font-size: 18px; line-height: 22px; letter-spacing: -0.144px; font-weight: 600; } /* 18/SemiBold, -0.8% */
.b { font-weight: 700; }
.c42 { color: var(--f42); } .c69 { color: var(--f69); } .c99 { color: var(--f99); } .cb4 { color: var(--fb4); }
.cmain { color: var(--main); } .cdark { color: var(--main-dark); } .cneg { color: var(--negative); } .cpos { color: var(--positive); } .cfff { color: var(--fff); }
.tc { text-align: center; } .tr { text-align: right; }
.ul { text-decoration: underline; text-decoration-skip-ink: none; text-underline-position: from-font; }
/* CSS adds letter-spacing after the last glyph; Figma's box does not */
.trk24 { margin-right: -0.24px; } .trk144 { margin-right: 0.144px; }

/* ---------- iOS chrome: Figma's own SVG export of each instance (SF Pro cannot be shipped) ---------- */
.ios-top { left: 0; top: 0; width: 402px; height: 62px; }
.ios-bot { left: 0; top: 766px; width: 402px; height: 108px; }   /* instance at y 776; its blur overhangs 10 above */
.ios-kb  { left: -14px; top: 448px; width: 430px; height: 426px; } /* instance at 0,474; its blur overhangs 14 / 26 */

/* The keyboard's background is three blended fills (luminosity, plus-lighter, plus-darker) under Figma's
   Glass effect. Chrome has no plus-darker and Glass is not in any export, so it renders as the export's
   top fill, flat #E6E9ED, where the canvas shows the page through it. */

/* ---------- Body ---------- */
.body { left: 0; top: 62px; width: 402px; height: 714px; display: flex; flex-direction: column; padding: 0 16px; isolation: isolate; }
.body-c { align-items: center; } .body-s { align-items: flex-start; }
.z1 { z-index: 1; } .z2 { z-index: 2; } .z3 { z-index: 3; } .z4 { z-index: 4; } .z5 { z-index: 5; } .z6 { z-index: 6; } .z7 { z-index: 7; }
.sec { position: relative; flex: none; width: 100%; }

/* Top Nav */
.nav { display: flex; gap: 16px; align-items: center; }
.nav-l { display: flex; flex: 1 0 0; min-width: 1px; gap: 2px; align-items: center; }
.nav-r { display: flex; flex: 1 0 0; min-width: 1px; gap: 8px; align-items: center; justify-content: flex-end; }
.nav-in { display: flex; flex: none; gap: 2px; align-items: center; }
.i16 { position: relative; flex: none; width: 16px; height: 16px; }
.i24 { position: relative; flex: none; width: 24px; height: 24px; }
.i40 { position: relative; flex: none; width: 40px; height: 40px; }
.prog { display: flex; flex: 1 0 0; min-width: 1px; height: 40px; gap: 4px; align-items: center; justify-content: center; }
.pill { flex: 1 0 0; height: 8px; max-width: 24px; min-width: 8px; border-radius: 16px; }
.dim40 { opacity: 0.4; } .dim0 { opacity: 0; } .dim80 { opacity: 0.8; } .dim88 { opacity: 0.88; }

/* notification line */
.note { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 32px; padding: 4px 0; border-radius: 24px; }
.note-in { display: flex; gap: 8px; align-items: center; width: 100%; min-height: 32px; padding: 2px 16px 4px; border-radius: 24px; }
.note-neg { background: rgba(209, 37, 37, 0.08); box-shadow: inset 0 0 0 1px rgba(209, 37, 37, 0.08); color: var(--negative); }
.note-pos { background: rgba(38, 161, 123, 0.08); box-shadow: inset 0 0 0 1px rgba(38, 161, 123, 0.08); color: var(--positive); }

/* HeaderBody */
.head { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 8px 16px 12px; }
.head-pop { padding: 4px 8px 8px; }
.w100 { width: 100%; }

/* Tab switches */
.tabs { display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 8px; }
.beam { position: absolute; height: 1px; background: var(--feb); }
.beam-l { left: -16px; width: 16px; } .beam-m { left: 0; right: 0; } .beam-r { right: -16px; width: 16px; }
.beam-b { bottom: -1px; } .beam-t { top: 0; }
.tabset { display: flex; flex: none; gap: 20px; align-items: center; }
.tab { position: relative; display: flex; flex: none; flex-direction: column; gap: 8px; align-items: flex-start; }
.tab-on { position: absolute; left: -2px; right: -2px; bottom: -6px; height: 2px; border-radius: 2px; background: var(--secondary); }
.lblm { display: flex; flex: none; gap: 2px; align-items: center; justify-content: center; }
.lblm12 { gap: 12px; }

/* lists */
.list { display: flex; flex: 1 0 0; min-height: 1px; flex-direction: column; align-items: flex-start; padding: 8px 0; overflow: hidden; }
.item { position: relative; flex: none; width: 100%; height: 80px; border-radius: 24px; overflow: hidden; }
.item-sel { background: var(--ff8); }
.item-info { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; white-space: nowrap; }
.item-ico { position: absolute; left: 8px; top: 8px; width: 64px; height: 64px; overflow: hidden; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); } /* smooth dropshadow */
.r40 { border-radius: 40px; } .r16 { border-radius: 16px; }
.fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.item-dot { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
.stk { position: absolute; left: 0; top: 0; pointer-events: none; }
.stk-soft-light { mix-blend-mode: soft-light; } .stk-lighten { mix-blend-mode: lighten; }

/* Bottom Dock */
.dock { display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 8px 0 4px; background: var(--fff); }
.pd { display: flex; flex: none; flex-direction: column; gap: 8px; align-items: flex-start; width: 370px; padding: 0 16px; }
.pd-row { display: flex; flex: none; gap: 16px; align-items: center; width: 100%; white-space: nowrap; }
.guide { display: flex; flex: 1 0 0; min-width: 1px; height: 17px; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 3px 0; }
.guide-beam { flex: none; width: 100%; height: 1px; background: var(--feb); }
.pair { display: flex; flex: none; gap: 4px; align-items: center; white-space: nowrap; }
.line { display: flex; flex: none; align-items: center; justify-content: center; width: 100%; }

/* ConfirmoButton. Offsets are from the button's own edge: Figma's strokes take no layout room. */
.cbtn { position: relative; flex: none; width: 100%; height: 96px; border-radius: 24px; overflow: hidden; }
.cbtn-lite { background: linear-gradient(90deg, #B8A0F8 0%, #7040F0 100%); }         /* Brand/Gradi Lite */
.cbtn-dark { background: linear-gradient(90deg, #2F0B8E 24%, #7040F0 100%); }        /* Brand/Gradi Dark */
.cbtn-sh { box-shadow: 0 4px 14px rgba(112, 64, 240, 0.24); }                        /* shadow/4 14 24 Main */
.tok { position: absolute; left: 8px; top: 8px; width: 80px; height: 80px; }
.tok-clip { position: absolute; left: 0; top: 0; width: 80px; height: 80px; border-radius: 40px; overflow: hidden; }
.net { position: absolute; left: 64px; top: 42px; width: 48px; height: 48px; }
