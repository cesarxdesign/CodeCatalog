:host{white-space:normal;letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;text-align:start;font-style:normal;font-variant:normal;line-height:normal;font-weight:400}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
svg { display: block; }

/* FRAME 560x978, square: Figma's 26px artboard corners (and its drop shadow on 01 and 06) are left off.
   Not a scaled artboard: type sizes are whole numbers at this size (30, 20, 18, 16, 15, 14, 12).
   The only fractions come from component instances Figma scaled (Line Item x1.11458, icons). */
.frame { position: relative; width: 560px; height: 978px; overflow: hidden; background: #fff;
         font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; color: #000; -webkit-font-smoothing: antialiased; }
.a  { position: absolute; }
.nw { white-space: nowrap; }
.sy { position: absolute; pointer-events: none; overflow: visible; }  /* SF Symbol glyph, outlined by Figma's export */
.gs { position: absolute; left: 0; top: 0; pointer-events: none; }    /* 'linear stroke' */
.ph { display: block; flex: none; }                                    /* the box a symbol's text node holds in a row */

/* type: line heights are Figma's text-box heights (IBM Plex auto = 1.3, box rounded) */
.s12 { font-size: 12px; line-height: 16px; }
.s14 { font-size: 14px; line-height: 18px; }
.s15 { font-size: 15px; line-height: 20px; }
.s16 { font-size: 16px; line-height: 21px; }
.s18 { font-size: 18px; line-height: 23px; }
.s20 { font-size: 20px; line-height: 26px; }
.w3 { font-weight: 300; } .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
.mono { font-family: 'IBM Plex Mono', monospace; }
/* Baseline rounding. IBM Plex: ascent 1.025em, descent .275em. Figma rounds the baseline, round(a + (lh - a - d)/2);
   Chrome rounds ascent and descent first and floors. They agree at 14/18, 18/23 and 30/39 and differ by one
   pixel at 12/16, 15/20, 16/21, 20/26 and the two scaled list sizes, so those are set one pixel down. An engine difference, not a design value. */
.s12, .s15, .s16, .s20, .lin, .lis { translate: 0 1px; }
